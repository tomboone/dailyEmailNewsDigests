name: ci

on:
  pull_request:
  push:
    branches: [main]

# A newer push to a PR cancels its older run; runs on main are never cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # uv sync, ruff check, ruff format --check, pyright, pytest. Scope and options live in pyproject.toml;
  # the test env comes from .github/ci/env. No image: this is an Azure Functions app.
  python:
    uses: neuroticsasquat-ch/workflows/.github/workflows/python.yml@v1

  ci: # the one required check; the name is the contract
    if: always()
    needs: [python] # every other job, extras included
    runs-on: ubuntu-latest
    steps:
      - uses: neuroticsasquat-ch/workflows/actions/gate@v1
        with:
          needs: ${{ toJSON(needs) }}
