name: ci

on:
  pull_request:
  push:
    branches: [main]

# A newer push to a PR cancels its older run; runs on main are never cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # uv sync, ruff check, ruff format --check, pyright, pytest. Scope and options live in pyproject.toml;
  # the test env comes from .github/ci/env. No image: this is an Azure Functions app.
  python:
    uses: neuroticsasquat-ch/workflows/.github/workflows/python.yml@v1

  # The deploy's `tofu init` is otherwise the first thing to read infra/. Here a provider bump the
  # config doesn't survive, or a lock file that no longer satisfies the constraints, fails the PR,
  # and dependencies.yml leaves a red Dependabot PR for a person instead of merging it.
  infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: '1.9' # OPENTOFU_VERSION in azure-functions-app-python.yml
          tofu_wrapper: false

      - run: tofu fmt -check -recursive
      # readonly: fail rather than write, so a stale lock fails here and not at deploy.
      - run: tofu init -backend=false -input=false -lockfile=readonly
      - run: tofu validate

  ci: # the one required check; the name is the contract
    if: always()
    needs: [python, infra] # every other job, extras included
    runs-on: ubuntu-latest
    steps:
      - uses: neuroticsasquat-ch/workflows/actions/gate@v1
        with:
          needs: ${{ toJSON(needs) }}
