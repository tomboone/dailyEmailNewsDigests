#file: noinspection UndefinedParamsPresent
name: Deploy to Azure Function

# Runs after the `ci` workflow succeeds on a push to main, so a deploy only ever follows the
# shared checks (ci.yml). Kept as its own workflow rather than jobs in ci.yml so the Azure OIDC
# grant (`id-token: write`) and the Azure secrets never sit in a workflow that runs on every PR.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

# Merges in quick succession (an auto-promoted dependency batch, say) queue here instead of racing
# for the Tofu state lock. A running deploy is never cancelled.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'
  OPENTOFU_VERSION: '1.9'

jobs:
  terraform:
    # A push run, not a PR run whose head branch happens to be named main.
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write
    outputs:
      function_app_name: ${{ steps.tf-output.outputs.function_app_name }}
    steps:
      # The commit ci passed on. A workflow_run's own SHA is main's tip when it fires, which can be
      # a later push whose ci hasn't finished, or failed.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.OPENTOFU_VERSION }}

      - name: Azure Login via OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        working-directory: infra
        run: |
          tofu init \
            -backend-config="resource_group_name=${{ secrets.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ secrets.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ secrets.TF_STATE_CONTAINER }}" \
            -backend-config="key=dailyemailnewsdigests.tfstate"
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"

      - name: Terraform Plan
        working-directory: infra
        run: tofu plan -out=tfplan
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"

      - name: Terraform Apply
        working-directory: infra
        run: tofu apply -auto-approve tfplan
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"

      - name: Get Terraform Outputs
        id: tf-output
        working-directory: infra
        run: echo "function_app_name=$(tofu output -raw function_app_name)" >> "$GITHUB_OUTPUT"
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"

  deploy:
    needs: terraform
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write
    steps:
      # The commit ci passed on. A workflow_run's own SHA is main's tip when it fires, which can be
      # a later push whose ci hasn't finished, or failed.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # pip below vendors packages for the Functions runtime, so it needs a system Python that
      # matches the app's runtime (python_version in infra/function_app.tf), not just uv's.
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v10.3.3

      # Runtime dependencies only: no dev group, and no editable entry for the project itself.
      - name: Export dependencies to requirements.txt
        run: uv export --locked --format requirements-txt --no-dev --no-emit-project --no-hashes --output-file requirements.txt

      - name: Install dependencies for deployment
        run: pip install --target=".python_packages/lib/site-packages" -r requirements.txt

      - name: Azure Login via OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ needs.terraform.outputs.function_app_name }}
          package: '.'
