[project]
name = "dailyemailnewsdigests"
version = "0.1.0"
description = "Azure Function app that fetches RSS feeds and sends daily email digests"
authors = [{ name = "Tom Boone", email = "tbc@tomboone.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "azure-functions>=1.23.0,<2.0.0",
    "azure-data-tables>=12.0.0,<13.0.0",
    "feedparser>=6.0.0,<7.0.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-mock>=3.17.0",
    "ruff>=0.17.3",
]

# The Functions app is deployed as source plus a vendored .python_packages/, not installed as a
# package, so uv manages the environment only.
[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
